# Minimal pipeline configuration for testing.
# Shows the bare minimum required to run a pipeline.

pipeline:
  name: test_migration

source:
  type: postgres
  config:
    host: localhost
    port: 5432
    database: test_db
    user: postgres
    password: postgres
    table: test_table

sink:
  type: postgres
  config:
    host: localhost
    port: 5432
    database: test_db
    user: postgres
    password: postgres
    table_name: test_landing
    drop_if_exists: true

# Transformations and validations are optional
transformations: []
validations: []
